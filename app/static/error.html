<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - DataSync Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .error-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .error-card {
            max-width: 500px;
            text-align: center;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .error-icon {
            font-size: 3rem;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="card error-card">
            <div class="card-body">
                <i class="fas fa-exclamation-circle error-icon mb-3"></i>
                <h1 class="card-title">{{ status_code }}</h1>
                <h5 class="card-subtitle mb-3 text-muted">{{ message }}</h5>
                <p class="card-text">Something went wrong. Please try again or contact support.</p>
                <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Back to Dashboard</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
